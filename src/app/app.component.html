<router-outlet></router-outlet>
<div class="sidebar d-flex flex-column justify-content-center align-items-center d-none d-lg-flex">
  <a class="h2 text-light ampliar" href="mailto:sanzadrian@hotmail.es" target="_blank">
    <i class="fas fa-envelope mb-3"></i>
  </a>
  <a class="h2 text-light ampliar" href="https://github.com/adrianssanz" target="_blank">
    <i class="fab fa-github mb-3"></i>
  </a>
  <a class="h2 text-light ampliar" href="https://www.linkedin.com/in/sanzadrian/" target="_blank">
    <i class="fab fa-linkedin mb-3"></i>
  </a>
</div>
<button [class.visible]="isVisible" (click)="scrollToTop()" class="volver-arriba">
  <div class="d-none d-lg-block volver-arriba-texto">{{ englishActive() ? 'Go up' : 'Volver arriba'}}</div>
  <div class="d-block d-lg-none"><i class="fa-solid fa-arrow-up"></i></div>
</button>
<a (click)="changeLanguage()" *ngIf="englishActive()" class="idioma ampliar">
  <img src="https://flagcdn.com/w40/es.png" alt="Bandera de España" width="30" height="30" class="rounded-circle" style="object-fit: cover;" loading="lazy">
</a>
<a (click)="changeLanguage()" *ngIf="!englishActive()" class="idioma ampliar">
  <img src="https://flagcdn.com/w40/gb.png" alt="Bandera del Reino Unido" width="30" height="30" class="rounded-circle" style="object-fit: cover;" loading="lazy">
</a>
<img  src="assets/icono.png" width="90" alt="Icono" class="logo">
<div class="cursor-glow" [ngStyle]="{'left.px': x, 'top.px': y}"></div>
<div class="cursor-glow2" [ngStyle]="{'left.px': x, 'top.px': y}"></div>
